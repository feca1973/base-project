services:
  proxy:
    volumes:
      - ./docker/proxy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${PROJECT_NAME:-base_project}-mailpit
    environment:
      # Env var instead of the --webroot flag: the image's built-in healthcheck
      # (/mailpit readyz) reads it too, otherwise it probes /readyz and stays unhealthy.
      MP_WEBROOT: /mailpit
    networks:
      - app

  php:
    environment:
      MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
