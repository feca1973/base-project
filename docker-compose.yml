services:
  proxy:
    image: nginx:1.27.4-alpine
    container_name: ${PROJECT_NAME}-proxy
    depends_on:
      - frontend
      - admin
      - backend
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: ${PROJECT_NAME}-frontend
    environment:
      NODE_ENV: development
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/nuxt:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app

  admin:
    build:
      context: ./admin
      target: dev
    container_name: ${PROJECT_NAME}-admin
    environment:
      NODE_ENV: development
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      NUXT_APP_BASE_URL: ${NUXT_ADMIN_BASE_URL:-/admin/}
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./admin/nuxt:/app
      - admin_node_modules:/app/node_modules
    networks:
      - app

  backend:
    image: nginx:1.27.4-alpine
    container_name: ${PROJECT_NAME}-backend-nginx
    depends_on:
      - php
    volumes:
      - ./backend/symfony:/var/www/html
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app

  php:
    build:
      context: ./backend
      target: dev
    container_name: ${PROJECT_NAME}-backend-php
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${BACKEND_APP_ENV}
      APP_DEBUG: ${BACKEND_APP_DEBUG}
      APP_SECRET: ${APP_SECRET:-change-me}
      TZ: ${BACKEND_TZ}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      MAILER_DSN: ${MAILER_DSN}
      MAILER_FROM: ${MAILER_FROM}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      APP_ADMIN_URL: ${APP_ADMIN_URL:-http://localhost:8080/admin}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    volumes:
      - ./backend/symfony:/var/www/html
    networks:
      - app

  mysql:
    image: mysql:8.4.8
    container_name: ${PROJECT_NAME}-mysql
    restart: unless-stopped
    command: --port=${MYSQL_INTERNAL_PORT}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${BACKEND_TZ}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --port=${MYSQL_INTERNAL_PORT} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  redis:
    image: redis:8.4.0
    container_name: ${PROJECT_NAME}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.11
    container_name: ${PROJECT_NAME}-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS}
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - app

  phpmyadmin:
    image: phpmyadmin:5.2.2
    container_name: ${PROJECT_NAME}-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: ${MYSQL_INTERNAL_PORT}
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT}
    ports:
      - "${PHPMYADMIN_PORT}:80"
    networks:
      - app

volumes:
  mysql_data:
  redis_data:
  elastic_data:
  admin_node_modules:
  frontend_node_modules:

networks:
  app:
    driver: bridge
